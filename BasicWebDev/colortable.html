<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunset Orchard Color Scheme</title>
</head>
<body>
  <table border="1" cellpadding="10" cellspacing="0">
    <thead>
      <tr>
        <th colspan="4" style="font-family: Arial, sans-serif; font-size: 24px; font-style: italic; font-weight: bold; text-align: center;">
          Sunset Orchard
        </th>
      </tr>
      <tr>
        <th>Color Name</th>
        <th>Hex</th>
        <th>RGB</th>
        <th>HSL</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td style="background-color: #FF6B6B;">Coral Glow</td>
        <td>#FF6B6B</td>
        <td>rgb(255, 107, 107)</td>
        <td>hsl(0, 100%, 71%)</td>
      </tr>
      <tr>
        <td style="background-color: #FFB347;">Peach Sun</td>
        <td>#FFB347</td>
        <td>rgb(255, 179, 71)</td>
        <td>hsl(34, 100%, 64%)</td>
      </tr>
      <tr>
        <td style="background-color: #7ED957;">Apple Leaf</td>
        <td>#7ED957</td>
        <td>rgb(126, 217, 87)</td>
        <td>hsl(100, 64%, 60%)</td>
      </tr>
      <tr>
        <td style="background-color: #4F86C6;">Sky Blue</td>
        <td>#4F86C6</td>
        <td>rgb(79, 134, 198)</td>
        <td>hsl(211, 52%, 54%)</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
