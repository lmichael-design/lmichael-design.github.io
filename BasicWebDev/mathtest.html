<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Test</title>
</head>
<body>

    <h1>Math Test</h1>

    <form>
        <label for="student-name">Your Name:</label>
        <input type="text" id="student-name" name="student-name" placeholder="Enter your name">
        <br><br>

        <h2>Multiple Choice Questions</h2>

        <p>1. What is 8 &plus; 5?</p>
        <input type="radio" id="q1a" name="question1" value="11">
        <label for="q1a">11</label><br>
        <input type="radio" id="q1b" name="question1" value="13">
        <label for="q1b">13</label><br>
        <input type="radio" id="q1c" name="question1" value="15">
        <label for="q1c">15</label><br>

        <p>2. What is 12 &times; 4?</p>
        <input type="radio" id="q2a" name="question2" value="36">
        <label for="q2a">36</label><br>
        <input type="radio" id="q2b" name="question2" value="48">
        <label for="q2b">48</label><br>
        <input type="radio" id="q2c" name="question2" value="52">
        <label for="q2c">52</label><br>

        <p>3. What is 20 &divide; 5?</p>
        <input type="radio" id="q3a" name="question3" value="2">
        <label for="q3a">2</label><br>
        <input type="radio" id="q3b" name="question3" value="4">
        <label for="q3b">4</label><br>
        <input type="radio" id="q3c" name="question3" value="5">
        <label for="q3c">5</label><br>

        <h2>Word Problem</h2>
        <p>
            4. Sarah has 3 boxes with 6 apples in each box. She gives 5 apples
            to her friend. How many apples does Sarah have left?
        </p>
        <label for="word-answer">Your answer:</label><br>
        <textarea id="word-answer" name="word-answer" rows="5" cols="40"
            placeholder="Write your answer here..."></textarea>
        <br><br>

        <button type="submit">Submit Test</button>
    </form>

</body>
</html>
