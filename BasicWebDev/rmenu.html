
<!DOCTYPE html>
<html>
<head>
  <style>
    .menu {
      width: 400px;
      height: 550px;
      padding: 20px;
      margin: 20px;
      border: 4px solid #333;
      background-repeat: no-repeat;
      background-position: center top;
      background-size: cover;
      display: inline-block;
      vertical-align: top;
      font-family: Arial, sans-serif;
      color: #222;
      box-sizing: border-box;
    }

    .breakfast {
      background-image: url("https://images.unsplash.com/photo-1525351484163-7529414344d8");
      background-color: #fff8e7;
    }

    .lunch {
      background-image: url("https://images.unsplash.com/photo-1498837167922-ddd27525d352");
      background-color: #eef8ff;
    }

    .dinner {
      background-image: url("https://images.unsplash.com/photo-1547592180-85f173990554");
      background-color: #f9f0ff;
    }

    h2 {
      text-align: center;
      margin-top: 120px;
      background: rgba(255,255,255,0.75);
      padding: 8px;
    }

    p {
      background: rgba(255,255,255,0.75);
      padding: 6px;
      width: fit-content;
    }
  </style>
</head>
<body>

  <div class="menu breakfast">
    <h2>Breakfast</h2>
    <p>Omelet</p>
    <p>Pancakes</p>
    <p>Toast</p>
    <p>Coffee</p>
  </div>

  <div class="menu lunch">
    <h2>Lunch</h2>
    <p>Turkey Sandwich</p>
    <p>Caesar Salad</p>
    <p>Soup</p>
    <p>Lemonade</p>
  </div>

  <div class="menu dinner">
    <h2>Dinner</h2>
    <p>Steak</p>
    <p>Mashed Potatoes</p>
    <p>Green Beans</p>
    <p>Iced Tea</p>
  </div>

</body>
</html>
