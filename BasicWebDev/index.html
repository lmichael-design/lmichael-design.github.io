
<!DOCTYPE html>
<html lang="en">
<head>

    <title>Snowmen Puzzle Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <!-- Section 1: Name and Puzzle -->
        <section class="heading">
            <h1>CSS Grid and Flexbox Assignment</h1>
            <p><strong>Name:</strong> Michael Lisci</p>
            <p><strong>Selected Puzzle:</strong> Snowmen</p>
        </section>

        <!-- Section 2: Puzzle -->
        <section class="puzzle-section">
            <h2>My Snowmen Puzzle</h2>

            <div class="puzzle">

                <!-- First Row -->
                <img src="images/puzzle2_K.jpg" alt="Puzzle piece K">
                <img src="images/puzzle2_M.jpg" alt="Puzzle piece M">
                <img src="images/puzzle2_E.jpg" alt="Puzzle piece E">
                <img src="images/puzzle2_G.jpg" alt="Puzzle piece G">

                <!-- Second Row -->
                <img src="images/puzzle2_A.jpg" alt="Puzzle piece A">
                <img src="images/puzzle2_D.jpg" alt="Puzzle piece D">
                <img src="images/puzzle2_L.jpg" alt="Puzzle piece L">

                <!-- Third Row -->
                <img src="images/puzzle2_F.jpg" alt="Puzzle piece F">
                <img src="images/puzzle2_J.jpg" alt="Puzzle piece J">
                <img src="images/puzzle2_H.jpg" alt="Puzzle piece H">
                <img src="images/puzzle2_I.jpg" alt="Puzzle piece I">

                <img class="wrong-piece" src="images/puzzle2_C.jpg" alt="Incorrect puzzle piece">

        <!-- Section 3: Assignment Date -->
        <section class="date-section">
